[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "django-catalog"
version = "0.1.0"
description = "Product catalog feature for the TestCap multi-repo Django project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Django>=5.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalog = ["templates/**/*.html", "migrations/*.py"]
